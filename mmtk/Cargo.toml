[package]
name = "mmtk-julia"
version = "0.32.0"
authors = ["Eduardo Souza <ledusou@gmail.com>", "Yi Lin <qinsoon@gmail.com>"]
build = "build.rs"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[build-dependencies]
cc = "*"
built = { version = "*", features = ["git2"] }
bindgen = "*"

[profile.release]
lto = true

[dependencies]
libc = "0.2"
lazy_static = "1.1"
# LXR: Point to wenyuzhao's mmtk-core fork with LXR support (v0.32.0-based)
# This rev is the one used by the proven-working OpenJDK LXR binding
mmtk = { path = "/onton/repos/wenyuzhao/mmtk-core" }
log = {version = "0.4", features = ["max_level_trace", "release_max_level_off"] }
enum-map = ">=2.1"
atomic = "0.4.6"
chrono = "*"
thread-id = "*"
memoffset = "*"

[features]
default = ["mmtk/vm_space", "mmtk/set_unlog_bits_vm_space", "julia_copy_stack", "mmtk/object_pinning", "mmtk/is_mmtk_object", "mmtk/vo_bit_access", "address_based_hashing"]

# Plans
nogc = []
immix = []
stickyimmix = ["mmtk/sticky_immix_non_moving_nursery", "mmtk/immix_smaller_block", "mmtk/set_unlog_bits_vm_space"]
lxr = ["mmtk/ix_always_defrag", "mmtk/set_unlog_bits_vm_space"]
lxr_no_nursery_evac = ["mmtk/lxr_no_nursery_evac"]
lxr_no_mature_evac = ["mmtk/lxr_no_mature_evac"]
lxr_no_evac = ["mmtk/lxr_no_evac"]
lxr_no_cm = ["mmtk/lxr_no_cm"]
lxr_stw = ["mmtk/lxr_stw"]
lxr_rc_death_diag = ["mmtk/lxr_rc_death_diag"]
lxr_rc_trace = ["mmtk/lxr_rc_trace"]
marksweep = []
object_pinning = ["mmtk/object_pinning"]
address_based_hashing = []

# This feature disables moving
non_moving = ["mmtk/immix_non_moving", "mmtk/immix_smaller_block"]
julia_copy_stack = []
