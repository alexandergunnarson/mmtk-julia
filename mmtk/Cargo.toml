[package]
name = "mmtk-julia"
version = "0.32.0"
authors = ["Eduardo Souza <ledusou@gmail.com>", "Yi Lin <qinsoon@gmail.com>"]
build = "build.rs"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# cdylib for Julia-hosted binding; staticlib for freestanding standalone
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
cc = { version = "*", optional = true }
built = { version = "*", features = ["git2"], optional = true }
bindgen = { version = "*", optional = true }

[profile.release]
lto = true

[dependencies]
libc = "0.2"
lazy_static = { version = "1.1", optional = true }
# Use mmtk-core from local repo (lxr-julia-v2 branch)
mmtk = { path = "/onton/repos/wenyuzhao/mmtk-core" }
log = {version = "0.4", features = ["max_level_trace", "release_max_level_off"] }
enum-map = { version = ">=2.1", optional = true }
atomic = { version = "0.4.6", optional = true }
chrono = { version = "*", optional = true }
thread-id = { version = "*", optional = true }
memoffset = { version = "*", optional = true }

# ykstackmaps = { git = "https://github.com/udesou/ykstackmaps.git", branch = "udesou-master", version = "*" }

[features]
default = ["hosted"]

# Julia-hosted binding (default): links against Julia's C runtime
hosted = [
    "mmtk/vm_space", "julia_copy_stack", "object_pinning",
    "dep:lazy_static", "dep:enum-map", "dep:atomic", "dep:chrono",
    "dep:thread-id", "dep:memoffset",
    "dep:cc", "dep:built", "dep:bindgen",
]

# julia-mlir binding: for binaries compiled by the julia-mlir compiler.
# Mutually exclusive with 'hosted'.
julia_mlir = ["julia_mlir_immix"]
julia_mlir_nogc = []
julia_mlir_immix = ["mmtk/immix_non_moving", "mmtk/single_worker"]
julia_mlir_immix_moving = ["mmtk/single_worker"]
julia_mlir_lxr = []

# Plans (hosted)
nogc = []
immix = []
stickyimmix = ["mmtk/sticky_immix_non_moving_nursery", "mmtk/immix_smaller_block", "mmtk/set_unlog_bits_vm_space"]
marksweep = []
object_pinning = ["mmtk/object_pinning"]

# This feature disables moving
non_moving = ["mmtk/immix_non_moving", "mmtk/immix_smaller_block"]
julia_copy_stack = []
